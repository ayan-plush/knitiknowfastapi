
services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-playwright-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Mount current directory for code reload
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    stdin_open: true
    tty: true
